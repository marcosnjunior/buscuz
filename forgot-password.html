<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#3A6A84" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Buscuz" />
    <title>Recuperar Senha - Buscuz</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="imagens/icone.png" />
    <link rel="apple-touch-icon" href="imagens/icone.png" />
    <script src="tema.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <i class="fas fa-key auth-icon"></i>
                    <h1>Recuperar Senha</h1>
                    <p>Enviaremos um link para redefinir sua senha</p>
                </div>

                <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                    <div id="forgotError" class="auth-error" style="display:none;"></div>
                    <div id="forgotSuccess" class="auth-success" style="display:none;">
                        <i class="fas fa-check-circle"></i> 
                        E-mail enviado! Verifique sua caixa de entrada.
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> E-mail</label>
                        <input type="email" id="email" required placeholder="seu@email.com" />
                    </div>

                    <button type="submit" id="forgotButton" class="primary-btn full-width">
                        <span id="forgotLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> </span>
                        Enviar Link
                    </button>

                    <div class="auth-links">
                        <a href="login.html"><i class="fas fa-arrow-left"></i> Voltar para o login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Carregar scripts na ordem correta -->
    <script src="pwa.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
