<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#1C9FFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Buscuz" />
    <title>Redefinir Senha - Buscuz</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="imagens/icone.png" />
    <link rel="apple-touch-icon" href="imagens/icone.png" />
    <script src="tema.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        .password-requirements {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .password-requirements small {
            font-size: 0.75rem;
            transition: all 0.3s;
        }
        .req-valid {
            color: #27ae60;
        }
        .req-valid i {
            color: #27ae60;
        }
        .req-invalid {
            color: #e74c3c;
        }
        .req-invalid i {
            color: #e74c3c;
        }
        .auth-success {
            background: #e8f5e9;
            color: #27ae60;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #27ae60;
            display: none;
        }
        .auth-error {
            background: #fde8e8;
            color: #e74c3c;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #e74c3c;
            display: none;
        }
        .auth-success i, .auth-error i {
            margin-right: 8px;
        }
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading-overlay i {
            font-size: 2rem;
            color: #3498db;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <i class="fas fa-lock-open auth-icon"></i>
                    <h1>Redefinir Senha</h1>
                    <p id="resetMessage">Digite sua nova senha</p>
                </div>

                <div id="loadingOverlay" class="loading-overlay">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Verificando link de recuperação...</p>
                </div>

                <form id="resetForm" style="display:none;">
                    <div id="resetError" class="auth-error"></div>
                    <div id="resetSuccess" class="auth-success">
                        <i class="fas fa-check-circle"></i> 
                        Senha redefinida com sucesso! Redirecionando para o login...
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Nova Senha</label>
                        <input type="password" id="newPassword" required placeholder="Mínimo 6 caracteres" />
                        <div class="password-requirements">
                            <small id="reset-req-length" class="req-invalid">
                                <i class="fas fa-circle"></i> Mínimo 6 caracteres
                            </small>
                            <small id="reset-req-letter" class="req-invalid">
                                <i class="fas fa-circle"></i> Pelo menos uma letra
                            </small>
                            <small id="reset-req-number" class="req-invalid">
                                <i class="fas fa-circle"></i> Pelo menos um número
                            </small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> Confirmar Senha</label>
                        <input type="password" id="confirmPassword" required placeholder="Digite a senha novamente" />
                        <div id="resetPasswordMatch" style="font-size:0.8rem; margin-top:4px;"></div>
                    </div>

                    <button type="submit" id="resetButton" class="primary-btn full-width">
                        <span id="resetLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> </span>
                        Redefinir Senha
                    </button>

                    <div class="auth-links">
                        <a href="login.html"><i class="fas fa-arrow-left"></i> Voltar para o login</a>
                        <span>|</span>
                        <a href="forgot-password.html">Solicitar novo link</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="pwa.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <script>
        // ===== PROCESSAR REDEFINIÇÃO DE SENHA =====
        document.addEventListener('DOMContentLoaded', async function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const resetForm = document.getElementById('resetForm');
            const resetMessage = document.getElementById('resetMessage');
            const errorElement = document.getElementById('resetError');
            
            // Verificar se há token na URL
            const hash = window.location.hash;
            const params = new URLSearchParams(hash.replace('#', '?'));
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const type = params.get('type');
            
            console.log('🔍 Verificando token de recuperação...');
            console.log('Access token:', accessToken ? 'Presente' : 'Ausente');
            console.log('Tipo:', type);
            
            if (accessToken && type === 'recovery') {
                // Mostrar loading
                loadingOverlay.style.display = 'block';
                
                try {
                    console.log('🔄 Tentando recuperar sessão...');
                    
                    // Tentar recuperar sessão com o token
                    const { data, error } = await window.SUPABASE_CLIENT.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    
                    loadingOverlay.style.display = 'none';
                    
                    if (error) {
                        console.error('❌ Erro ao recuperar sessão:', error);
                        resetMessage.textContent = '❌ Link inválido ou expirado.';
                        errorElement.textContent = 'O link de recuperação é inválido ou expirou. Solicite um novo.';
                        errorElement.style.display = 'block';
                        return;
                    }
                    
                    console.log('✅ Sessão recuperada com sucesso!');
                    resetMessage.textContent = '🔐 Link válido! Digite sua nova senha abaixo.';
                    resetForm.style.display = 'block';
                    
                } catch (error) {
                    loadingOverlay.style.display = 'none';
                    console.error('❌ Erro ao processar token:', error);
                    resetMessage.textContent = '❌ Erro ao processar link.';
                    errorElement.textContent = 'Ocorreu um erro ao processar o link. Solicite um novo.';
                    errorElement.style.display = 'block';
                }
            } else {
                // Sem token, mostrar erro
                resetMessage.textContent = '❌ Link inválido.';
                errorElement.textContent = 'Este link de recuperação é inválido. Solicite um novo link.';
                errorElement.style.display = 'block';
            }
        });

        // ===== VALIDAÇÃO DE SENHA EM TEMPO REAL =====
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('newPassword');
            const confirmInput = document.getElementById('confirmPassword');
            
            if (passwordInput) {
                passwordInput.addEventListener('input', function() {
                    const password = this.value;
                    
                    const reqLength = document.getElementById('reset-req-length');
                    if (password.length >= 6) {
                        reqLength.className = 'req-valid';
                        reqLength.innerHTML = '<i class="fas fa-check-circle"></i> Mínimo 6 caracteres';
                    } else {
                        reqLength.className = 'req-invalid';
                        reqLength.innerHTML = '<i class="fas fa-circle"></i> Mínimo 6 caracteres';
                    }
                    
                    const reqLetter = document.getElementById('reset-req-letter');
                    if (/[a-zA-Z]/.test(password)) {
                        reqLetter.className = 'req-valid';
                        reqLetter.innerHTML = '<i class="fas fa-check-circle"></i> Pelo menos uma letra';
                    } else {
                        reqLetter.className = 'req-invalid';
                        reqLetter.innerHTML = '<i class="fas fa-circle"></i> Pelo menos uma letra';
                    }
                    
                    const reqNumber = document.getElementById('reset-req-number');
                    if (/[0-9]/.test(password)) {
                        reqNumber.className = 'req-valid';
                        reqNumber.innerHTML = '<i class="fas fa-check-circle"></i> Pelo menos um número';
                    } else {
                        reqNumber.className = 'req-invalid';
                        reqNumber.innerHTML = '<i class="fas fa-circle"></i> Pelo menos um número';
                    }
                });
            }

            if (confirmInput) {
                confirmInput.addEventListener('input', function() {
                    const password = document.getElementById('newPassword').value;
                    const confirm = this.value;
                    const matchDiv = document.getElementById('resetPasswordMatch');
                    
                    if (confirm.length === 0) {
                        matchDiv.innerHTML = '';
                        return;
                    }
                    
                    if (password === confirm) {
                        matchDiv.innerHTML = '<span style="color:#27ae60;"><i class="fas fa-check-circle"></i> Senhas coincidem</span>';
                    } else {
                        matchDiv.innerHTML = '<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> Senhas não coincidem</span>';
                    }
                });
            }
        });
    </script>
</body>
</html>
