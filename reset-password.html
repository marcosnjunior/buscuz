<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Redefinir Senha - Buscuz</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        .password-requirements {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .password-requirements small {
            font-size: 0.75rem;
            transition: all 0.3s;
        }
        .req-valid {
            color: #27ae60;
        }
        .req-valid i {
            color: #27ae60;
        }
        .req-invalid {
            color: #e74c3c;
        }
        .req-invalid i {
            color: #e74c3c;
        }
        .auth-success {
            background: #e8f5e9;
            color: #27ae60;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #27ae60;
            display: none;
        }
        .auth-error {
            background: #fde8e8;
            color: #e74c3c;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid #e74c3c;
            display: none;
        }
        .auth-success i, .auth-error i {
            margin-right: 8px;
        }
        .token-status {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .token-valid {
            background: #e8f5e9;
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }
        .token-invalid {
            background: #fde8e8;
            color: #e74c3c;
            border-left: 4px solid #e74c3c;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <i class="fas fa-lock-open auth-icon"></i>
                    <h1>Redefinir Senha</h1>
                    <p id="resetMessage">Digite sua nova senha</p>
                </div>

                <div id="tokenStatus" class="token-status" style="display:none;"></div>

                <form id="resetForm" onsubmit="handleResetPassword(event)">
                    <div id="resetError" class="auth-error" style="display:none;"></div>
                    <div id="resetSuccess" class="auth-success" style="display:none;">
                        <i class="fas fa-check-circle"></i> 
                        Senha redefinida com sucesso! Redirecionando...
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Nova Senha</label>
                        <input type="password" id="newPassword" required placeholder="Mínimo 6 caracteres" />
                        <div class="password-requirements">
                            <small id="reset-req-length" class="req-invalid">
                                <i class="fas fa-circle"></i> Mínimo 6 caracteres
                            </small>
                            <small id="reset-req-letter" class="req-invalid">
                                <i class="fas fa-circle"></i> Pelo menos uma letra
                            </small>
                            <small id="reset-req-number" class="req-invalid">
                                <i class="fas fa-circle"></i> Pelo menos um número
                            </small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> Confirmar Senha</label>
                        <input type="password" id="confirmPassword" required placeholder="Digite a senha novamente" />
                        <div id="resetPasswordMatch" style="font-size:0.8rem; margin-top:4px;"></div>
                    </div>

                    <button type="submit" id="resetButton" class="primary-btn full-width">
                        <span id="resetLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> </span>
                        Redefinir Senha
                    </button>

                    <div class="auth-links">
                        <a href="login.html"><i class="fas fa-arrow-left"></i> Voltar para o login</a>
                        <span>|</span>
                        <a href="forgot-password.html">Solicitar novo link</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Verificar token da URL
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenHash = urlParams.get('token_hash');
            const type = urlParams.get('type');
            const tokenStatus = document.getElementById('tokenStatus');
            const resetMessage = document.getElementById('resetMessage');
            const resetButton = document.getElementById('resetButton');
            
            console.log('🔍 Verificando token...');
            console.log('Token hash:', tokenHash);
            console.log('Tipo:', type);
            
            if (tokenHash && type === 'recovery') {
                tokenStatus.style.display = 'block';
                tokenStatus.className = 'token-status token-valid';
                tokenStatus.innerHTML = '✅ <strong>Link válido!</strong> Digite sua nova senha abaixo.';
                resetMessage.textContent = '🔐 Link de recuperação verificado com sucesso!';
                resetButton.disabled = false;
            } else {
                tokenStatus.style.display = 'block';
                tokenStatus.className = 'token-status token-invalid';
                tokenStatus.innerHTML = '⚠️ <strong>Link inválido ou expirado.</strong> Solicite um novo link de recuperação.';
                resetMessage.textContent = '⚠️ Link inválido. Solicite uma nova recuperação.';
                resetButton.disabled = true;
                document.getElementById('resetForm').querySelectorAll('input').forEach(input => {
                    input.disabled = true;
                });
            }
        });

        // Validação de senha em tempo real
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('newPassword');
            const confirmInput = document.getElementById('confirmPassword');
            
            if (passwordInput) {
                passwordInput.addEventListener('input', function() {
                    const password = this.value;
                    
                    const reqLength = document.getElementById('reset-req-length');
                    if (password.length >= 6) {
                        reqLength.className = 'req-valid';
                        reqLength.innerHTML = '<i class="fas fa-check-circle"></i> Mínimo 6 caracteres';
                    } else {
                        reqLength.className = 'req-invalid';
                        reqLength.innerHTML = '<i class="fas fa-circle"></i> Mínimo 6 caracteres';
                    }
                    
                    const reqLetter = document.getElementById('reset-req-letter');
                    if (/[a-zA-Z]/.test(password)) {
                        reqLetter.className = 'req-valid';
                        reqLetter.innerHTML = '<i class="fas fa-check-circle"></i> Pelo menos uma letra';
                    } else {
                        reqLetter.className = 'req-invalid';
                        reqLetter.innerHTML = '<i class="fas fa-circle"></i> Pelo menos uma letra';
                    }
                    
                    const reqNumber = document.getElementById('reset-req-number');
                    if (/[0-9]/.test(password)) {
                        reqNumber.className = 'req-valid';
                        reqNumber.innerHTML = '<i class="fas fa-check-circle"></i> Pelo menos um número';
                    } else {
                        reqNumber.className = 'req-invalid';
                        reqNumber.innerHTML = '<i class="fas fa-circle"></i> Pelo menos um número';
                    }
                });
            }

            if (confirmInput) {
                confirmInput.addEventListener('input', function() {
                    const password = document.getElementById('newPassword').value;
                    const confirm = this.value;
                    const matchDiv = document.getElementById('resetPasswordMatch');
                    
                    if (confirm.length === 0) {
                        matchDiv.innerHTML = '';
                        return;
                    }
                    
                    if (password === confirm) {
                        matchDiv.innerHTML = '<span style="color:#27ae60;"><i class="fas fa-check-circle"></i> Senhas coincidem</span>';
                    } else {
                        matchDiv.innerHTML = '<span style="color:#e74c3c;"><i class="fas fa-times-circle"></i> Senhas não coincidem</span>';
                    }
                });
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
