<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Cadastro - Buscuz</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <i class="fas fa-route auth-icon"></i>
                    <h1>Criar Conta</h1>
                    <p>Comece a planejar suas viagens</p>
                </div>

                <form id="signupForm" onsubmit="handleSignup(event)">
                    <div id="signupError" class="auth-error" style="display:none;"></div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nome</label>
                        <input type="text" id="name" required placeholder="Seu nome completo" />
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> E-mail</label>
                        <input type="email" id="email" required placeholder="seu@email.com" />
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Senha</label>
                        <input type="password" id="password" required placeholder="Mínimo 6 caracteres" />
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> Confirmar Senha</label>
                        <input type="password" id="confirmPassword" required placeholder="Digite a senha novamente" />
                    </div>

                    <button type="submit" id="signupButton" class="primary-btn full-width">
                        <span id="signupLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> </span>
                        Cadastrar
                    </button>

                    <div class="auth-links">
                        Já tem uma conta? <a href="login.html">Faça login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Carregar scripts na ordem correta -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</body>
</html>
