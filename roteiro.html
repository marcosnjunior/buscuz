<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#3A6A84" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Buscuz" />
    <title>Buscuz - Roteiro da Viagem</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="imagens/icone.png" />
    <link rel="apple-touch-icon" href="imagens/icone.png" />
    <script src="tema.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="app">
        <!-- Cabeçalho -->
        <header>
            <button id="btnVoltar" class="icon-btn" type="button" aria-label="Voltar"><i class="fas fa-arrow-left"></i></button>
            <h1 id="headerTitle">Roteiro</h1>
            <div class="header-actions">
                <span id="syncStatus" class="sync-chip" role="status">Sincronizado</span>
            </div>
        </header>

        <div id="totaisViagem" class="totais-viagem" aria-live="polite"></div>

        <main id="mainScreen">
            <div id="trechosContainer" class="trechos-grid">
                <!-- Cards serão injetados aqui -->
            </div>
        </main>

        <nav class="tabbar" aria-label="Menu do roteiro">
            <button type="button" class="tab-item" id="btnNovoTrecho">
                <i class="fas fa-plus"></i>
                <span>Trecho</span>
            </button>
            <button type="button" class="tab-item" id="btnResumoViagem">
                <i class="fas fa-chart-pie"></i>
                <span>Resumo</span>
            </button>
            <button type="button" class="tab-item" id="btnSyncRoteiro">
                <i class="fas fa-sync"></i>
                <span>Sync</span>
            </button>
            <button type="button" class="tab-item" id="btnConfigRoteiro">
                <i class="fas fa-cog"></i>
                <span>Ajustes</span>
            </button>
        </nav>

        <!-- Modal de Configuração -->
        <div id="configModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2><i class="fas fa-sliders-h"></i> Configurações</h2>
                <section class="config-section">
                    <h3>Aparência</h3>
                    <div class="form-group">
                        <label for="temaApp">Tema</label>
                        <select id="temaApp">
                            <option value="sistema">Automático</option>
                            <option value="claro">Claro</option>
                            <option value="escuro">Escuro</option>
                        </select>
                    </div>
                </section>
                <section class="config-section">
                    <h3>Veículo</h3>
                    <div class="form-group">
                        <label for="consumoMedio">Consumo médio (km/l)</label>
                        <input type="number" id="consumoMedio" step="0.1" min="0" />
                    </div>
                    <div class="form-group">
                        <label for="precoCombustivel">Preço do combustível (R$/l)</label>
                        <input type="number" id="precoCombustivel" step="0.01" min="0" />
                    </div>
                </section>
                <section class="config-section">
                    <h3>Sincronização</h3>
                    <p class="config-hint">Intervalo neste aparelho. O botão Sincronizar continua disponível.</p>
                    <div class="form-group">
                        <label for="syncInterval">Intervalo</label>
                        <select id="syncInterval">
                            <option value="0">Somente manual</option>
                            <option value="60000">1 minuto</option>
                            <option value="300000">5 minutos</option>
                            <option value="900000">15 minutos</option>
                            <option value="1800000">30 minutos</option>
                            <option value="3600000">1 hora</option>
                        </select>
                    </div>
                    <p id="syncPreferenciaStatus" class="config-hint"></p>
                </section>
                <button id="btnSalvarConfig" class="primary-btn" type="button">Salvar</button>
            </div>
        </div>

        <!-- Modal de Cadastro de Trecho -->
        <div id="trechoModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTrechoTitle"><i class="fas fa-road"></i> Novo Trecho</h2>
                <form id="formTrecho">
                    <input type="hidden" id="trechoId" />
                    <div class="form-group">
                        <label>Cidade atual</label>
                        <input type="text" id="cidadeAtual" required placeholder="Ex: São Paulo" />
                    </div>
                    <div class="form-group">
                        <label>Próxima cidade</label>
                        <input type="text" id="proximaCidade" required placeholder="Ex: Rio de Janeiro" />
                    </div>
                    <div class="form-group">
                        <label>Distância (km)</label>
                        <input type="number" id="distancia" step="0.1" min="0" required />
                    </div>
                    <div class="form-group">
                        <label>Tempo estimado de deslocamento (horas)</label>
                        <input type="number" id="tempoEstimado" step="0.1" min="0" required />
                    </div>
                    <div class="form-group">
                        <label>Data de Check-in</label>
                        <input type="date" id="dataCheckin" required />
                    </div>
                    <div class="form-group">
                        <label>Data de Check-out</label>
                        <input type="date" id="dataCheckout" required />
                    </div>
                    
                    <div class="form-group">
                        <label>Odômetro atual (km)</label>
                        <input type="number" id="odometro" step="0.1" min="0" />
                    </div>
                    <button type="submit" class="primary-btn">Salvar Trecho</button>
                </form>
            </div>
        </div>

        <!-- Modal de Detalhes do Trecho -->
        <div id="detalhesModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="detalhesContent">
                    <!-- Conteúdo dinâmico -->
                </div>
            </div>
        </div>

        <!-- Modal de Ponto Turístico -->
        <div id="pontoModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2><i class="fas fa-map-marker-alt"></i> Ponto Turístico</h2>
                <form id="formPonto">
                    <input type="hidden" id="pontoId" />
                    <input type="hidden" id="pontoTrechoId" />
                    <div class="form-group">
                        <label>Nome do ponto *</label>
                        <input type="text" id="pontoNome" required placeholder="Ex: Cristo Redentor" />
                    </div>
                    <div class="form-group">
                        <label>URL do Google Maps</label>
                        <input type="url" id="pontoLocalizacao" placeholder="https://www.google.com/maps/place/..." />
                        <small style="color: #7f8c8d; font-size: 0.8rem;">
                            <i class="fas fa-info-circle"></i> 
                            Opcional - Cole o link do Google Maps para a localização exata
                        </small>
                    </div>
                    <div class="form-group">
                        <label>Data da visita</label>
                        <input type="date" id="pontoData" />
                    </div>
                    <div class="form-group">
                        <label>Custo da entrada (R$) *</label>
                        <input type="number" id="pontoCusto" step="0.01" min="0" required />
                    </div>
                    <div class="form-group">
                        <label>Observações</label>
                        <textarea id="pontoObservacoes" rows="2" placeholder="Dicas, horários de funcionamento..."></textarea>
                    </div>
                    <button type="submit" class="primary-btn">Salvar Ponto</button>
                </form>
            </div>
        </div>

        <!-- Modal de Despesa -->
        <div id="despesaModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2><i class="fas fa-receipt"></i> Despesa do Trecho</h2>
                <form id="formDespesa">
                    <input type="hidden" id="despesaId" />
                    <input type="hidden" id="despesaTrechoId" />
                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" id="despesaDescricao" required placeholder="Ex: Pedágio, balsa..." />
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="despesaValor" step="0.01" min="0" required />
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="despesaData" />
                    </div>
                    <div class="form-group">
                        <label>Tipo</label>
                        <input type="hidden" id="despesaTipo" value="pedagio" />
                        <div class="tipo-chips" id="despesaTipoChips">
                            <button type="button" class="tipo-chip active" data-tipo="pedagio"><i class="fas fa-road"></i> Pedágio</button>
                            <button type="button" class="tipo-chip" data-tipo="balsa"><i class="fas fa-ship"></i> Balsa</button>
                            <button type="button" class="tipo-chip" data-tipo="abastecimento"><i class="fas fa-gas-pump"></i> Abastecimento</button>
                            <button type="button" class="tipo-chip" data-tipo="alimentacao"><i class="fas fa-utensils"></i> Alimentação</button>
                            <button type="button" class="tipo-chip" data-tipo="entrada"><i class="fas fa-ticket-alt"></i> Entrada</button>
                            <button type="button" class="tipo-chip" data-tipo="hospedagem"><i class="fas fa-bed"></i> Hospedagem</button>
                            <button type="button" class="tipo-chip" data-tipo="outro"><i class="fas fa-ellipsis-h"></i> Outro</button>
                        </div>
                    </div>
                    <button type="submit" class="primary-btn">Salvar Despesa</button>
                </form>
            </div>
        </div>

        <!-- Modal de Resumo da Viagem -->
        <div id="resumoModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2><i class="fas fa-chart-pie"></i> Resumo da Viagem</h2>
                <div id="resumoContent">
                    <!-- Conteúdo dinâmico -->
                </div>
            </div>
        </div>
    </div>

    <script src="pwa.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
