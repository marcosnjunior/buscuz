<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#1C9FFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Buscuz" />
    <title>Buscuz - Minhas Viagens</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="imagens/icone.png" />
    <link rel="apple-touch-icon" href="imagens/icone.png" />
    <script src="tema.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="app">
        <!-- Cabeçalho -->
        <header>
            <div class="header-brand">
                <img src="imagens/icone.png" alt="" class="brand-icon" />
                <h1>Buscuz</h1>
            </div>
            <div class="header-actions">
                <span id="syncStatus" class="sync-chip" role="status">Sincronizado</span>
                <button id="btnConfig" class="icon-btn" type="button" aria-label="Configurações"><i class="fas fa-cog"></i></button>
                <div class="user-info" id="userInfo"></div>
            </div>
        </header>

        <!-- Tela Principal -->
        <main id="mainScreen">
            <div class="toolbar">
                <button id="btnNovaViagem" class="primary-btn"><i class="fas fa-plus"></i> Nova Viagem</button>
                <button id="btnSync" class="secondary-btn"><i class="fas fa-sync"></i> Sincronizar</button>
            </div>
            
            <!-- Filtros -->
            <div class="filtros">
                <button class="filtro-btn active" data-filtro="todas">Todas</button>
                <button class="filtro-btn" data-filtro="planejado">📅 Planejadas</button>
                <button class="filtro-btn" data-filtro="em-andamento">🔄 Em Andamento</button>
                <button class="filtro-btn" data-filtro="finalizado">✅ Finalizadas</button>
            </div>

            <div id="viagensContainer">
                <!-- Viagens serão injetadas aqui -->
            </div>
        </main>

        <!-- Modal de Configuração -->
        <div id="configModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2><i class="fas fa-sliders-h"></i> Configurações</h2>
                <section class="config-section">
                    <h3>Aparência</h3>
                    <div class="form-group">
                        <label for="temaApp">Tema</label>
                        <select id="temaApp">
                            <option value="sistema">Automático</option>
                            <option value="claro">Claro</option>
                            <option value="escuro">Escuro</option>
                        </select>
                    </div>
                </section>
                <section class="config-section">
                    <h3>Veículo</h3>
                    <div class="form-group">
                        <label for="consumoMedio">Consumo médio (km/l)</label>
                        <input type="number" id="consumoMedio" step="0.1" min="0" />
                    </div>
                    <div class="form-group">
                        <label for="precoCombustivel">Preço do combustível (R$/l)</label>
                        <input type="number" id="precoCombustivel" step="0.01" min="0" />
                    </div>
                </section>
                <section class="config-section">
                    <h3>Sincronização</h3>
                    <p class="config-hint">Intervalo neste aparelho. O botão Sincronizar continua disponível.</p>
                    <div class="form-group">
                        <label for="syncInterval">Intervalo</label>
                        <select id="syncInterval">
                            <option value="0">Somente manual</option>
                            <option value="60000">1 minuto</option>
                            <option value="300000">5 minutos</option>
                            <option value="900000">15 minutos</option>
                            <option value="1800000">30 minutos</option>
                            <option value="3600000">1 hora</option>
                        </select>
                    </div>
                    <p id="syncPreferenciaStatus" class="config-hint"></p>
                </section>
                <button id="btnSalvarConfig" class="primary-btn" type="button">Salvar</button>
            </div>
        </div>

        <!-- Modal de Nova Viagem -->
        <div id="viagemModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalViagemTitle"><i class="fas fa-suitcase"></i> Nova Viagem</h2>
                <form id="formViagem">
                    <input type="hidden" id="viagemId" />
                    <div class="form-group">
                        <label>Nome da Viagem *</label>
                        <input type="text" id="viagemNome" required placeholder="Ex: Férias na Europa 2024" />
                    </div>
                    <div class="form-group">
                        <label>Destino Principal</label>
                        <input type="text" id="viagemDestino" placeholder="Ex: Paris, França" />
                    </div>
                    <div class="form-group">
                        <label>Data de Início</label>
                        <input type="date" id="viagemDataInicio" required />
                    </div>
                    <div class="form-group">
                        <label>Data de Fim</label>
                        <input type="date" id="viagemDataFim" required />
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="viagemDescricao" rows="2" placeholder="Detalhes sobre a viagem..."></textarea>
                    </div>
                    <button type="submit" class="primary-btn">Salvar Viagem</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Carregar scripts na ordem correta -->
    <script src="pwa.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
