<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Login - Buscuz</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <i class="fas fa-route auth-icon"></i>
                    <h1>Buscuz</h1>
                    <p>Faça login para acessar suas viagens</p>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div id="loginError" class="auth-error" style="display:none;"></div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> E-mail</label>
                        <input type="email" id="email" required placeholder="seu@email.com" />
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Senha</label>
                        <input type="password" id="password" required placeholder="Digite sua senha" />
                    </div>

                    <button type="submit" id="loginButton" class="primary-btn full-width">
                        <span id="loginLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> </span>
                        Entrar
                    </button>

                    <div class="auth-links">
                        <a href="forgot-password.html">Esqueceu a senha?</a>
                        <span>|</span>
                        <a href="signup.html">Criar conta</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Carregar scripts na ordem correta -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</body>
</html>
